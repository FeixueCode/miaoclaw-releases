name: Stage verified Miaoclaw 4.0.1 asset
on: workflow_dispatch
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and upload only the frozen installer to its owned draft
        shell: bash
        run: |
          set -euo pipefail
          file=Miaoclaw-Setup-4.0.1.exe
          curl --fail --location --connect-timeout 30 --max-time 600 --output "$file" 'https://miaoclaw-1449106480.cos.ap-shanghai.myqcloud.com/v4.0.1/Miaoclaw-Setup-4.0.1.exe'
          printf '%s  %s\n' 'f052cb36ae0879e0b121772ebe6e4ef0520db9318818498952a7bbd51e6fc1b0' "$file" | sha256sum --check
          test "$(stat --format=%s "$file")" = 294226243
          gh api repos/FeixueCode/miaoclaw-releases/releases/387887229 > release-before.json
          jq --exit-status '.draft == true and .tag_name == "v4.0.1" and .name == "Miaoclaw 4.0.1 [candidate:052f882b8a750b3880f226ff1de2a73821a2b1d6:f052cb36ae0879e0b121772ebe6e4ef0520db9318818498952a7bbd51e6fc1b0]" and ([.assets[] | select(.name == "Miaoclaw-Setup-4.0.1.exe")] | length == 0)' release-before.json
          gh release upload v4.0.1 "$file" --repo FeixueCode/miaoclaw-releases
          gh api repos/FeixueCode/miaoclaw-releases/releases/387887229 > release-after.json
          jq --exit-status '.draft == true and ([.assets[] | select(.name == "Miaoclaw-Setup-4.0.1.exe" and .size == 294226243 and .state == "uploaded")] | length == 1)' release-after.json
