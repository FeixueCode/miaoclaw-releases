name: Verify published Miaoclaw 4.0.1 bytes
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download public files and verify every byte
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 20 --max-time 300 -o installer.exe 'https://github.com/FeixueCode/miaoclaw-releases/releases/download/v4.0.1/Miaoclaw-Setup-4.0.1.exe'
          test "$(stat --format=%s installer.exe)" = 294226243
          printf '%s  %s\n' 'f052cb36ae0879e0b121772ebe6e4ef0520db9318818498952a7bbd51e6fc1b0' installer.exe | sha256sum --check
          curl -fsSL --connect-timeout 20 --max-time 120 -o primary.apk 'https://app.miao-claw.com/dl/Miaoclaw-android-0.4.0.apk'
          curl -fsSL --connect-timeout 20 --max-time 120 -o mirror.apk 'https://github.com/FeixueCode/miaoclaw-releases/releases/download/v3.3.4/Miaoclaw-android-0.4.0.apk'
          for file in primary.apk mirror.apk; do
            test "$(stat --format=%s "$file")" = 6932695
            printf '%s  %s\n' 'ccae37ec336fcab335a0ed9a183dd27150aaa4a8b229c9997e11cca1e1e73eb8' "$file" | sha256sum --check
          done
          echo 'PASS: complete public GitHub installer and both Android downloads match frozen release bytes'
